<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plán reelu: __NAZEV__</title>
<style>
  :root { --pozadi:#faf7f2; --karta:#ffffff; --text:#2b2522; --slabe:#7d726b; --ramecek:#e4ddd4; --zelena:#2f7d4f;
          --cervena:#b23a3a; --oranzova:#a8650f; --oranzove-pozadi:#fff4e0; --vyber:#f3d36b; --obrazovka:#3a302b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background:var(--pozadi); color:var(--text); font-size:15px; }
  button { font: inherit; padding:6px 10px; border:1px solid var(--ramecek); background:#fff; border-radius:8px; cursor:pointer; color:var(--text); }
  button:hover { border-color:#c9bfb4; }
  button.hlavni { background:var(--zelena); color:#fff; border-color:var(--zelena); font-weight:600; padding:9px 16px; }
  button.maly { font-size:13px; padding:4px 8px; }
  button:disabled { opacity:.5; cursor:default; }
  header { position:sticky; top:0; z-index:5; background:var(--pozadi); border-bottom:1px solid var(--ramecek); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1 1 220px; }
  .ulozeni { font-size:14px; color:var(--slabe); }
  .ulozeni.chyba { color:var(--cervena); }
  .pruh { margin:10px 16px 0; padding:10px 12px; border-radius:10px; font-size:14px; line-height:1.45; }
  .pruh.stary { background:var(--oranzove-pozadi); border:1px solid #f0d6a8; }
  .pruh.ok { background:#eef7f0; border:1px solid #cfe6d5; color:var(--zelena); }
  .rozlozeni { display:grid; grid-template-columns: 300px 1fr; gap:20px; padding:12px 16px 80px; align-items:start; }
  aside { position:sticky; top:64px; display:flex; flex-direction:column; gap:14px; }
  video { width:100%; max-height:46vh; background:#000; border-radius:10px; display:block; }
  .panel { background:var(--karta); border:1px solid var(--ramecek); border-radius:12px; padding:12px; }
  .panel h2 { font-size:15px; margin:0 0 8px; }
  .napoveda { font-size:13px; color:var(--slabe); line-height:1.4; margin:4px 0 8px; }
  .pridat { width:100%; padding:12px; border:2px dashed #cdbfb0; background:#fffdf9; font-weight:600; border-radius:10px; }
  .knihovna { display:grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap:8px; margin-top:10px; }
  .medium { border:1px solid var(--ramecek); border-radius:8px; overflow:hidden; background:#f4efe8; cursor:pointer; text-align:left; padding:0; }
  .medium img { width:100%; aspect-ratio:1; object-fit:contain; display:block; background:#efe8df; }
  .medium span { display:block; font-size:12px; padding:3px 5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .medium.pouzity span::before { content:"● "; color:var(--zelena); }
  .zalozky { display:flex; gap:4px; border-bottom:1px solid var(--ramecek); margin-bottom:12px; flex-wrap:wrap; }
  .zalozky button { border:none; border-bottom:3px solid transparent; border-radius:0; background:none; padding:8px 14px; font-weight:600; color:var(--slabe); }
  .zalozky button.aktivni { color:var(--text); border-bottom-color:var(--text); }
  .chybi { background:var(--oranzove-pozadi); border:1px solid #f0d6a8; border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .chybi h3 { margin:0 0 6px; font-size:14px; }
  .chybi .polozka { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:6px 0; border-top:1px solid #f0d6a8; font-size:14px; }
  .chybi .polozka:first-of-type { border-top:none; }
  .chybi .polozka .co { flex:1 1 200px; }
  .karty { display:grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap:12px; }
  .karta { background:var(--karta); border:1px solid var(--ramecek); border-radius:12px; overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column; }
  .karta:hover { border-color:#c9bfb4; }
  .karta.vybrana { outline:3px solid var(--vyber); outline-offset:1px; }
  .obrazovka { position:relative; aspect-ratio:9/16; max-height:300px; width:100%; background:var(--obrazovka); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .obrazovka img { width:86%; height:70%; object-fit:contain; }
  .obrazovka .vice { position:absolute; display:flex; gap:4px; flex-wrap:wrap; justify-content:center; padding:10px; }
  .obrazovka .vice img { width:44%; height:auto; max-height:40%; }
  .obrazovka .napis { color:#fff; font-weight:800; font-size:17px; line-height:1.15; text-align:center; padding:10px; text-transform:uppercase; word-break:break-word; }
  .obrazovka .napis.dole { position:absolute; bottom:12%; left:6%; right:6%; background:rgba(255,255,255,.92); color:var(--text); border-radius:10px; text-transform:none; font-size:15px; }
  .obrazovka .ikona { color:#e9dfd5; font-size:14px; text-align:center; padding:12px; line-height:1.4; }
  .obrazovka .ikona b { display:block; font-size:28px; margin-bottom:6px; }
  .obrazovka.chybi-obr { background:repeating-linear-gradient(45deg, #fbeed6, #fbeed6 10px, #f7e4c2 10px, #f7e4c2 20px); }
  .obrazovka.chybi-obr .ikona { color:var(--oranzova); font-weight:600; }
  .popis { padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; }
  .typ { font-size:13px; font-weight:700; }
  .kde { font-size:13px; color:var(--slabe); }
  .veta-text { font-size:15px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .znacky { display:flex; gap:4px; flex-wrap:wrap; }
  .znacka { font-size:12px; padding:1px 7px; border-radius:20px; background:#f1ece6; }
  .znacka.pozor { background:var(--oranzove-pozadi); color:var(--oranzova); font-weight:600; }
  .proužky { display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .prouzek { display:flex; gap:10px; align-items:center; background:var(--karta); border:1px solid var(--ramecek); border-radius:10px; padding:8px 10px; cursor:pointer; text-align:left; width:100%; }
  .prouzek.vybrana { outline:3px solid var(--vyber); }
  .prouzek .kde { flex:0 0 60px; }
  .prouzek .t { flex:1; font-size:14px; color:var(--slabe); }
  h3.oddil { font-size:14px; color:var(--slabe); margin:18px 0 8px; font-weight:600; }
  .veta { display:grid; grid-template-columns: 36px 1fr; gap:8px; padding:10px 8px; border-bottom:1px solid var(--ramecek); border-radius:8px; }
  .veta.vybrana { background:#fff8e1; }
  .veta.smazana .text { text-decoration:line-through; color:var(--slabe); }
  .veta .text { font-size:16px; line-height:1.5; }
  .slovo { cursor:pointer; padding:0 1px; border-radius:3px; }
  .slovo:hover { background:#fff0c2; }
  .slovo.ven { text-decoration:line-through; color:var(--cervena); }
  .cipy { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  .cip { display:flex; gap:6px; align-items:center; font-size:13px; padding:3px 8px 3px 3px; border-radius:20px; background:#f1ece6; border:1px solid var(--ramecek); }
  .cip img { width:26px; height:26px; object-fit:cover; border-radius:50%; }
  .cip .tecka { width:26px; height:26px; border-radius:50%; background:var(--obrazovka); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .cip.chybi { background:var(--oranzove-pozadi); color:var(--oranzova); }
  dialog { border:none; border-radius:14px; padding:0; width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 40px); }
  dialog::backdrop { background:rgba(40,30,25,.45); }
  .dlg { padding:16px; display:flex; flex-direction:column; gap:12px; }
  .dlg h2 { margin:0; font-size:18px; }
  .dlg label { font-size:13px; font-weight:600; display:block; margin-bottom:4px; }
  .dlg select, .dlg input[type=text], .dlg textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--ramecek); border-radius:8px; background:#fff; }
  .dlg .citace { background:#f6f1ea; border-radius:8px; padding:8px 10px; font-size:15px; line-height:1.45; }
  .dlg .vyber-obr { display:grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap:6px; }
  .dlg .vyber-obr .medium.zvoleny { outline:3px solid var(--zelena); }
  .dlg .tlacitka { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .dlg .konflikt { background:var(--oranzove-pozadi); border-radius:8px; padding:8px 10px; font-size:14px; }
  .nic { color:var(--slabe); font-size:14px; padding:12px 0; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--ramecek); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; z-index:5; }
  footer .info { font-size:14px; color:var(--slabe); flex:1 1 240px; }
  @media (max-width: 820px) {
    .rozlozeni { grid-template-columns: 1fr; }
    aside { position:static; }
    video { max-height:50vh; width:auto; margin:0 auto; }
    .karty { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <h1>Plán reelu: __NAZEV__</h1>
  <span class="ulozeni" id="ulozeni"></span>
  <button class="hlavni" id="ulozit">Uložit změny</button>
</header>
<div id="pruh-nahled"></div>
<div class="rozlozeni">
  <aside>
    <div>
      <video id="video" controls preload="metadata" src="/video"></video>
      <div class="napoveda" id="video-popis"></div>
    </div>
    <div class="panel">
      <h2>Moje média</h2>
      <div class="napoveda">Tvoje fotky, screenshoty a logo. Studio do videa dá jen to, co sem nahraješ. Nic si nevymýšlí.</div>
      <button class="pridat" id="pridat">+ Přidat fotku, screenshot nebo logo</button>
      <input type="file" id="soubor" accept="image/png,image/jpeg,image/webp" multiple hidden>
      <input type="file" id="soubor-vymena" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="knihovna" id="knihovna"></div>
    </div>
  </aside>
  <main>
    <div class="zalozky" id="zalozky">
      <button data-z="sceny" class="aktivni">Scény</button>
      <button data-z="text">Text</button>
      <button data-z="vzhled">Vzhled</button>
      <button data-z="zvuk">Zvuk</button>
    </div>
    <section id="z-sceny"></section>
    <section id="z-text" hidden></section>
    <section id="z-vzhled" hidden></section>
    <section id="z-zvuk" hidden></section>
  </main>
</div>
<footer>
  <span class="info">Až budeš hotová, klikni na Hotovo a napiš Claudovi „vytvoř reel“. Nové video vznikne podle tohohle plánu.</span>
  <button id="hotovo">Hotovo</button>
</footer>
<dialog id="dlg"><div class="dlg" id="dlg-obsah"></div></dialog>
<script>
const DATA = __DATA__;
const plan = JSON.parse(JSON.stringify(DATA.plan));
let otiskPlanu = DATA.otisk_planu;
let media = DATA.media.slice();
const odkazy = Object.assign({}, DATA.odkazy);
const text = { smazane: new Set(), ven: {} };
for (const v of DATA.vety) text.ven[v.id] = new Set(v.slova.filter(s => s.vynechano).map(s => s.i));
let zmenyPlan = false, zmenyText = false, vybranaVeta = null, zalozka = 'sceny', nahled = DATA.nahled;
const video = document.getElementById('video');
const vetaPodleId = {}; DATA.vety.forEach((v, i) => { vetaPodleId[v.id] = Object.assign({ cislo: i + 1 }, v); });

function h(tag, attrs, ...deti) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'on') for (const [u, f] of Object.entries(v)) el.addEventListener(u, f);
    else if (k === 'text') el.textContent = v;
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const d of deti.flat()) if (d !== null && d !== undefined && d !== false) el.append(d.nodeType ? d : document.createTextNode(d));
  return el;
}
function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(1).padStart(4, '0'); }
function jmeno(prvek) { return (DATA.jmena[prvek] || prvek).replace('⚠️ ', ''); }
function cisty(t) { return (t || '').replace(/\*/g, '').replace(/\s*[\/|]\s*/g, ' · '); }

// obrázky v obsahu řádku: „soubor | štítek“, „a.jpg / b.jpg“
function obrazkyRadku(r) {
  const out = [];
  for (const kus of String(r.obsah || '').replace(/\|/g, '\n').replace(/ \/ /g, '\n').split('\n')) {
    const k = kus.trim();
    if (/\.(png|jpe?g|webp)$/i.test(k)) out.push({ text: k, klic: odkazy[k] || odkazy[k.split('/').pop()] || null });
  }
  return out;
}
function urlMedia(klic) { const m = media.find(x => x.klic === klic); return m ? m.url : null; }
function radkyVety(id) { return plan.radky.filter(r => r.veta === id); }
function vyznamny(r) { return r.prvek !== 'zoom'; }
function pozor(r) { return !!(r.zkontrolovat || r.navrh); }
function chybiObrazek(r) { return r.prvek === 'chybi_obrazek'; }

function zmenaPlanu(r) { if (r) { r.rucne = true; } zmenyPlan = true; ukazUlozeni(); vykresli(); }
function ukazUlozeni(t, chyba) {
  const el = document.getElementById('ulozeni');
  el.className = 'ulozeni' + (chyba ? ' chyba' : '');
  el.textContent = t || ((zmenyPlan || zmenyText) ? 'Máš neuložené změny.' : '');
}

function pruhNahledu() {
  const el = document.getElementById('pruh-nahled'); el.innerHTML = '';
  const casti = [];
  if (nahled.cekaji_upravy) casti.push('úpravy textu čekají na nový střih');
  if (nahled.zmeny && nahled.zmeny.length) casti.push('změněno od posledního videa: ' + nahled.zmeny.join(', '));
  if (nahled.stav === 'aktualni' && !zmenyPlan && !zmenyText) {
    el.append(h('div', { class: 'pruh ok', text: '✓ Náhled odpovídá poslednímu uloženému plánu.' }));
  } else if (nahled.stav === 'zadne') {
    el.append(h('div', { class: 'pruh stary', text: 'Video zatím není. Až plán uložíš, napiš Claudovi „vytvoř reel“.' }));
  } else if (nahled.stav === 'nevim') {
    if (zmenyPlan || zmenyText) casti.unshift('máš neuložené změny');
    el.append(h('div', { class: 'pruh stary', text: 'Nevím, jestli náhled odpovídá plánu (video vzniklo dřív, než to studio umělo poznat). Pro jistotu vytvoř reel znovu.' + (casti.length ? ' Navíc: ' + casti.join('; ') + '.' : '') }));
  } else {
    if (zmenyPlan || zmenyText) casti.unshift('máš neuložené změny');
    el.append(h('div', { class: 'pruh stary' }, h('b', { text: 'Náhled zatím neobsahuje poslední úpravy. ' }), casti.join('; ') + '. Nové video vytvoří Claude, když mu napíšeš „vytvoř reel“.'));
  }
  document.getElementById('video-popis').textContent = DATA.video ? 'Video: ' + DATA.video : '';
}

// ---------- knihovna médií ----------
function pouziti(klic) {
  const out = [];
  for (const r of plan.radky) if (obrazkyRadku(r).some(o => o.klic === klic)) out.push(r);
  return out;
}
function vykresliKnihovnu() {
  const k = document.getElementById('knihovna'); k.innerHTML = '';
  const vlastni = media.filter(m => m.knihovna);
  if (!vlastni.length) k.append(h('div', { class: 'nic', text: 'Zatím tu nic není.' }));
  for (const m of vlastni) {
    const pouzity = pouziti(m.klic).length > 0;
    k.append(h('button', { class: 'medium' + (pouzity ? ' pouzity' : ''), title: m.jmeno + (pouzity ? ' (ve videu)' : ''), on: { click: () => dialogMedia(m) } },
      h('img', { src: m.url, alt: m.jmeno, loading: 'lazy' }), h('span', { text: m.jmeno })));
  }
}
async function nahraj(soubory) {
  const nove = [];
  for (const f of soubory) {
    ukazUlozeni('Nahrávám ' + f.name + '…');
    try {
      const r = await fetch('/nahraj?jmeno=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      const d = await r.json();
      if (!r.ok) throw new Error(d.chyba || r.status);
      media.push(d.media); odkazy[d.media.jmeno] = d.media.klic; nove.push(d.media);
    } catch (e) { ukazUlozeni('Nahrání nešlo: ' + e.message, true); alert('Nahrání nešlo: ' + e.message); }
  }
  if (nove.length) ukazUlozeni(nove.length === 1 ? 'Nahráno: ' + nove[0].jmeno : 'Nahráno ' + nove.length + ' souborů.');
  vykresliKnihovnu();
  return nove;
}
document.getElementById('pridat').onclick = () => document.getElementById('soubor').click();
document.getElementById('soubor').onchange = async e => { await nahraj([...e.target.files]); e.target.value = ''; };

function dialogMedia(m) {
  const kde = pouziti(m.klic);
  otevriDialog(
    h('h2', { text: m.jmeno }),
    h('img', { src: m.url, alt: m.jmeno, style: 'max-width:100%;max-height:40vh;object-fit:contain;border-radius:8px;background:#efe8df' }),
    h('div', { class: 'napoveda', text: kde.length ? 'Ve videu u ' + kde.map(r => 'věty ' + (vetaPodleId[r.veta] || {}).cislo).join(', ') + '.' : 'Zatím není u žádné scény.' }),
    h('div', {}, h('label', { text: 'Přiřadit ke scéně (k větě)' }), vyberVety(id => { pridejObrazekKVete(id, m); zavriDialog(); })),
    h('div', { class: 'tlacitka' },
      h('button', { text: 'Vyměnit za jiný soubor', on: { click: () => vymenMedium(m) } }),
      h('button', { text: 'Odložit', on: { click: () => odlozMedium(m) } }),
      h('button', { text: 'Zavřít', on: { click: zavriDialog } })));
}
function vyberVety(naVyber) {
  const s = h('select', {}, h('option', { value: '', text: 'Vyber větu…' }),
    DATA.vety.map(v => h('option', { value: v.id, text: (vetaPodleId[v.id].cislo) + '. ' + v.text.slice(0, 70) })));
  s.onchange = () => { if (s.value) naVyber(s.value); };
  return s;
}
function pridejObrazekKVete(id, m) {
  const radky = radkyVety(id);
  const cil = radky.find(r => r.prvek === 'chybi_obrazek') || radky.find(r => r.prvek === 'zoom');
  if (cil) { cil.prvek = 'vlozka'; cil.obsah = m.jmeno; delete cil.odmitnuto; zmenaPlanu(cil); }
  else {
    const v = vetaPodleId[id];
    const r = { veta: id, text: v.text, text_vety: v.text, od: v.od, do: v.do, prvek: 'vlozka', obsah: m.jmeno, duvod: 'přidala zákaznice', zdroj: 'zákaznice', typ: 'vlozka' };
    plan.radky.splice(poziceVety(id), 0, r); zmenaPlanu(r);
  }
  vybranaVeta = id; vykresli();
}
function poziceVety(id) {
  const poradi = DATA.vety.map(v => v.id), cil = poradi.indexOf(id);
  let i = 0;
  while (i < plan.radky.length && poradi.indexOf(plan.radky[i].veta) <= cil) i++;
  return i;
}
function vymenMedium(m) {
  const vstup = document.getElementById('soubor-vymena');
  vstup.onchange = async e => {
    const nove = await nahraj([...e.target.files]); e.target.value = '';
    if (!nove.length) return;
    for (const r of pouziti(m.klic)) {
      for (const o of obrazkyRadku(r)) if (o.klic === m.klic) r.obsah = r.obsah.split(o.text).join(nove[0].jmeno);
      zmenaPlanu(r);
    }
    zavriDialog(); vykresli();
    ukazUlozeni('Vyměněno ve scénách. Ulož změny, pak můžeš starý obrázek odložit.');
  };
  vstup.click();
}
async function odlozMedium(m) {
  const kde = pouziti(m.klic);
  if (kde.length) {
    if (!confirm('Obrázek je ve ' + kde.length + ' scéně/scénách. Odebrat ho z nich (scéna pak bude jen přiblížení) a odložit?')) return;
    for (const r of kde) { r.prvek = 'zoom'; r.obsah = ''; zmenaPlanu(r); }
    if (!(await uloz())) return;
  }
  const r = await fetch('/odloz', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jmeno: m.jmeno }) });
  const d = await r.json();
  if (!r.ok) { alert(d.chyba); return; }
  media = media.filter(x => x.klic !== m.klic);
  zavriDialog(); vykresli(); ukazUlozeni('Odloženo do PODKLADY-SEM/ODLOZENE (nic se nesmazalo).');
}

// ---------- scény ----------
function obrazovka(r) {

      (chybiObrazek(r) ? 'chybí obrázek' : jmeno(r.prvek)) + (r.obsah && !obr && DATA.textove.includes(r.prvek) ? ': ' + cisty(r.obsah).slice(0, 30) : '')));

function upravyTextu() {

  el.append(h('div', { class: 'panel' }, h('h2', { text: 'Vzhled tohohle reelu' }),
    h('div', { text: vz.vzhled ? 'Vzhled: ' + vz.vzhled + (vz.titulky_z ? ', titulky ze vzhledu ' + vz.titulky_z : '') + (vz.zoom ? ', s přiblížením' : '') : 'Vzhled zatím není vybraný.' }),
    h('div', { class: 'napoveda', text: 'Vzhled a titulky si vybereš v knihovně stylů. Kód stylu pak napiš Claudovi. Úpravy přímo tady přijdou v další verzi.' }),
    h('a', { href: DATA.odkaz_styly, target: '_blank', rel: 'noopener', text: 'Otevřít knihovnu stylů' })));
}
function vykresliZvuk() {
  const el = document.getElementById('z-zvuk'); el.innerHTML = '';
  el.append(h('div', { class: 'panel' }, h('h2', { text: 'Zvuk' }),
    h('div', { class: 'napoveda', text: 'Zvukové efekty teď přidává studio samo k některým prvkům. Zapínat a vypínat je u jednotlivých scén půjde v další verzi. Když nějaký zvuk nechceš, napiš to Claudovi.' })));
}

// ---------- obecné ----------
function vykresli() {
  pruhNahledu(); vykresliKnihovnu();
  if (zalozka === 'sceny') vykresliSceny();
  if (zalozka === 'text') vykresliText();
  if (zalozka === 'vzhled') vykresliVzhled();
  if (zalozka === 'zvuk') vykresliZvuk();
}
function prepni(z) {
  zalozka = z;
  document.querySelectorAll('#zalozky button').forEach(b => b.classList.toggle('aktivni', b.dataset.z === z));
  for (const n of ['sceny', 'text', 'vzhled', 'zvuk']) document.getElementById('z-' + n).hidden = n !== z;
  vykresli();
  if (vybranaVeta) {
    const cil = z === 'text' ? document.getElementById('veta-' + vybranaVeta) : document.querySelector('.karta[data-veta="' + vybranaVeta + '"]');
    if (cil) cil.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}
document.querySelectorAll('#zalozky button').forEach(b => b.onclick = () => prepni(b.dataset.z));
const dlg = document.getElementById('dlg');
function otevriDialog(...obsah) {
  const kont = document.getElementById('dlg-obsah'); kont.innerHTML = '';
  if (obsah.length === 1 && obsah[0].classList && obsah[0].classList.contains('dlg')) { kont.replaceWith(obsah[0]); obsah[0].id = 'dlg-obsah'; }
  else kont.append(...obsah);
  if (!dlg.open) dlg.showModal();
}
function zavriDialog() { if (dlg.open) dlg.close(); vykresli(); }

async function uloz() {
  ukazUlozeni('Ukládám…');
  try {
    if (zmenyPlan) {
      const r = await fetch('/uloz-plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ otisk: otiskPlanu, radky: plan.radky, bez_vety: plan.bez_vety }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.chyba || r.status);
      otiskPlanu = d.otisk; nahled = d.nahled; zmenyPlan = false;
    }
    if (zmenyText) {
      const r = await fetch('/uloz-text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(upravyTextu()) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.chyba || r.status);
      nahled = d.nahled; zmenyText = false;
    }
    ukazUlozeni('✓ Uloženo ' + new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }));
    vykresli();
    return true;
  } catch (e) {
    ukazUlozeni('Uložení nešlo: ' + e.message, true);
    alert('Uložení nešlo: ' + e.message);
    return false;
  }
}
document.getElementById('ulozit').onclick = uloz;
document.getElementById('hotovo').onclick = async () => {
  if ((zmenyPlan || zmenyText) && !confirm('Máš neuložené změny. Uložit je a skončit?')) return;
  if ((zmenyPlan || zmenyText) && !(await uloz())) return;
  await fetch('/konec', { method: 'POST' });
  document.body.innerHTML = '<p style="padding:24px;font-size:18px">Hotovo, okno můžeš zavřít. Teď napiš Claudovi „vytvoř reel“.</p>';
};
window.addEventListener('beforeunload', e => { if (zmenyPlan || zmenyText) { e.preventDefault(); e.returnValue = ''; } });
video.addEventListener('error', () => { document.getElementById('video-popis').textContent = 'Video se nepodařilo načíst.'; });
vykresli();
</script>
